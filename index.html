<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Uyarısı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      position: fixed; /* Mobilde kaymaları önler */
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    @keyframes glitch {
      0% { transform: translate(-50%, -50%) translate(0, 0); }
      25% { transform: translate(-50%, -50%) translate(-2px, 2px); }
      50% { transform: translate(-50%, -50%) translate(2px, -2px); }
      75% { transform: translate(-50%, -50%) translate(-2px, -2px); }
      100% { transform: translate(-50%, -50%) translate(0, 0); }
    }

    .warning-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #ff0000;
      box-shadow: 0 0 20px #ff0000;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 340px;
      color: white;
      animation: glitch 0.2s infinite alternate;
    }

    .warning-title {
      color: #ff3333;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #ff0000;
    }

    .warning-text {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 15px;
      color: #dddddd;
    }

    .timer-container {
      color: #ffcc00;
      font-size: 15px;
      font-weight: bold;
      background: rgba(255, 0, 0, 0.2);
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #ff3333;
    }

    #joke-content {
      display: none;
    }

    .joke-title {
      color: #00ff00;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff00;
      margin-bottom: 15px;
    }

    .joke-text {
      font-size: 14px;
      color: #ffffff;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="warning-box">
    <!-- 1. Aşama: Korkutucu Ekran -->
    <div id="scary-content">
      <div class="warning-title">⚠️ KRİTİK SİSTEM HATASI ⚠️</div>
      <div class="warning-text">
        Cihazınıza izinsiz erişim sağlandı.<br>
        Tüm verileriniz siliniyor!
      </div>
      <div class="timer-container">
        Sistemin Sıfırlanmasına:<br>
        <span id="timer" style="font-size: 30px; color: #ff0000;">10</span> saniye
      </div>
    </div>

    <!-- 2. Aşama: Şaka Açıklaması -->
    <div id="joke-content">
      <div class="joke-title">YAKALANDIN! 😜</div>
      <div class="joke-text">
        Telefonuna hiçbir şey olmadı, tamamen şakaydı! ❤️
      </div>
    </div>
  </div>

  <script>
    // Matrix Efekti
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    // Geri Sayım Mantığı
    let timeLeft = 10;
    const timerElement = document.getElementById('timer');
    const scaryContent = document.getElementById('scary-content');
    const jokeContent = document.getElementById('joke-content');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timerElement) {
        timerElement.innerText = timeLeft;
      }

      if (timeLeft <= 0) {
        clearInterval(countdown);
        
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200]);
        }

        scaryContent.style.display = 'none';
        jokeContent.style.display = 'block';
      }
    }, 1000);
  </script>
</body>
</html>
