<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Başlatılıyor...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            position: fixed; user-select: none;
        }

        /* 1. Aşama: Samsung Logo Ekranı (Model Adı Olmadan) */
        #samsung-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; height: 100%; background: #000; color: #fff; text-align: center;
        }
        .samsung-title { font-size: 28px; font-weight: 300; letter-spacing: 4px; }
        .powered-by { font-size: 11px; color: #777; margin-top: 10px; font-weight: 400; letter-spacing: 1px; }
        .samsung-secured { font-size: 9px; color: #444; position: absolute; bottom: 30px; letter-spacing: 1px; }

        /* Glitch (Bozulma) Efekti */
        .glitch-active {
            animation: glitch-anim 0.1s infinite;
        }
        @keyframes glitch-anim {
            0% { background: #000; transform: translate(0); }
            20% { background: #ff0000; transform: translate(-5px, 5px); }
            40% { background: #0000ff; transform: translate(5px, -5px); }
            60% { background: #ff0055; filter: invert(100%); }
            80% { background: #000; transform: translate(-3px, -3px); }
            100% { background: #ff0000; transform: translate(0); }
        }

        /* 2. Aşama: EZPhone Virüs Ekranı */
        #virus-screen {
            display: none; width: 100%; height: 100%; background: #ff0000;
            color: #ffffff; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 20px;
        }
        .virus-title { font-size: 32px; font-weight: 900; letter-spacing: 3px; font-family: monospace; text-shadow: 2px 2px #000; }
        .virus-sub { font-size: 16px; margin-top: 15px; font-weight: bold; font-family: monospace; animation: blink 0.3s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* 3. Aşama: Android No Command Ekranı */
        #recovery-screen {
            display: none; width: 100%; height: 100%; background: #000;
            color: #fff; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; font-family: sans-serif;
        }
        .android-icon { font-size: 60px; margin-bottom: 15px; color: #ff3333; }
        .no-command-text { color: #ff3333; font-size: 18px; font-weight: bold; }
        .recovery-log { font-size: 11px; color: #888; font-family: monospace; margin-top: 20px; text-align: left; }

        /* Jumpscare & Şaka Sonu */
        #fullscreen-jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
        #jumpscareVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }

        #joke-screen {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 100;
            background: rgba(15, 15, 15, 0.95); border: 2px solid #00ff00;
            padding: 25px; border-radius: 16px; text-align: center;
            width: 85%; max-width: 320px; color: white;
        }
        .joke-title { color: #00ff00; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .restart-btn {
            background: #00ff00; color: #000; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. Samsung Başlangıç Ekranı (Model İsmi Yok) -->
    <div id="samsung-screen">
        <div class="samsung-title">SAMSUNG</div>
        <div class="powered-by">Powered by Android</div>
        <div class="samsung-secured">Secured by Knox</div>
    </div>

    <!-- 2. EZPhone Kırmızı Virüs Ekranı -->
    <div id="virus-screen">
        <div class="virus-title">EZPHONE VIRUS v1</div>
        <div class="virus-sub">DELETING SYSTEM FILES...</div>
        <div style="font-size: 12px; margin-top: 30px; font-family: monospace;">CRITICAL ERROR: ROOT OVERRIDE</div>
    </div>

    <!-- 3. Android No Command Ekranı -->
    <div id="recovery-screen">
        <div class="android-icon">⚠️</div>
        <div class="no-command-text">No command.</div>
        <div class="recovery-log" id="recoveryLog">
            E:Failed to mount /system<br>
            E:Can't open /dev/block/bootdevice<br>
            E:Formatting /data...
        </div>
    </div>

    <!-- 4. Korku Videosu & Şaka Ekranı -->
    <div id="fullscreen-jumpscare">
        <video id="jumpscareVideo" preload="auto" playsinline>
            <source src="korku.mp4" type="video/mp4">
        </video>
    </div>

    <div id="joke-screen">
        <div class="joke-title">YAKALANDIN! 😱</div>
        <p style="font-size: 14px; line-height: 1.5;">Telefonuna hiçbir şey olmadı,<br>tamamen şakaydı! ❤️</p>
        <button class="restart-btn" onclick="location.reload()">Başa Dön</button>
    </div>

    <script>
        let videoTrack = null;

        // Flaş izni için ilk dokunuşu yakala
        document.body.addEventListener('click', async () => {
            if (!videoTrack) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoTrack = stream.getVideoTracks()[0];
                } catch (e) {}
            }
        }, { once: true });

        function setFlashState(state) {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                videoTrack.applyConstraints({ advanced: [{ torch: state }] }).catch(e => {});
            }
        }

        // Akış Zamanlaması
        setTimeout(() => {
            // 3. saniyede: Glitch (bozulma) başlar
            document.body.classList.add('glitch-active');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            setFlashState(true);

            setTimeout(() => {
                // 4.5. saniyede: Kırmızı EZPhone Virüs Ekranına geçiş
                document.body.classList.remove('glitch-active');
                setFlashState(false);
                document.getElementById('samsung-screen').style.display = 'none';
                document.getElementById('virus-screen').style.display = 'flex';
                if (navigator.vibrate) navigator.vibrate([400, 100, 400]);

                setTimeout(() => {
                    // 7.5. saniyede: Android Recovery (No Command) Ekranına geçiş
                    document.getElementById('virus-screen').style.display = 'none';
                    document.getElementById('recovery-screen').style.display = 'flex';

                    setTimeout(() => {
                        // 10. saniyede: Jumpscare Video Patlaması!
                        if (navigator.vibrate) navigator.vibrate([1000, 100, 1000]);
                        const overlay = document.getElementById('fullscreen-jumpscare');
                        const video = document.getElementById('jumpscareVideo');
                        
                        overlay.style.display = 'block';
                        video.play().catch(() => {});

                        video.onended = () => {
                            overlay.style.display = 'none';
                            document.getElementById('recovery-screen').style.display = 'none';
                            document.getElementById('joke-screen').style.display = 'block';
                            setFlashState(false);
                        };
                    }, 2500);

                }, 3000);

            }, 1500);

        }, 3000);
    </script>
</body>
</html>
