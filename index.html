<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Oyun Merkezi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 15px;
            background-color: #1e293b;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.4rem;
            color: #38bdf8;
        }

        .score-board {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MENÜ BÖLÜMÜ */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .game-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: #38bdf8;
        }

        .game-card h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .game-card p {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* OYUN ALANI */
        .game-view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .game-view.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .back-btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        canvas {
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            touch-action: none;
        }

        /* MOBİL DOKUNMATİK KONTROLLER */
        .touch-controls {
            margin-top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
        }

        .btn-ctrl {
            background-color: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ctrl:active {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .action-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 5px;
        }

        .btn-action {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            width: 45%;
        }

        .btn-action:active {
            background-color: #38bdf8;
        }

        /* 2048 VE HAFIZA OYUNU İÇİN İLAVE IZGARA STİLLERİ */
        .grid-container {
            display: grid;
            gap: 8px;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 8px;
            width: 320px;
            height: 320px;
        }

        .memory-card {
            background-color: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .tile-2048 {
            background-color: #334155;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mobil Oyun Merkezi</h1>
        <div class="score-board">Toplam Puan: <span id="total-score">0</span></div>
    </header>

    <div class="container">
        <!-- ANA MENÜ -->
        <div id="main-menu" class="menu-grid">
            <div class="game-card" onclick="openGame('snake')">
                <h3>🐍 Yılan</h3>
                <p>Klasik Yılan Oyunu</p>
            </div>
            <div class="game-card" onclick="openGame('pong')">
                <h3>🏓 Pong</h3>
                <p>Dokunmatik Raket</p>
            </div>
            <div class="game-card" onclick="openGame('flappy')">
                <h3>🐤 Flappy</h3>
                <p>Engel Geçme</p>
            </div>
            <div class="game-card" onclick="openGame('invaders')">
                <h3>👾 Uzay Savaşı</h3>
                <p>Düşmanları Yok Et</p>
            </div>
            <div class="game-card" onclick="openGame('memory')">
                <h3>🎴 Hafıza Kartı</h3>
                <p>Eşleri Bul</p>
            </div>
            <div class="game-card" onclick="openGame('g2048')">
                <h3>🔢 2048</h3>
                <p>Sayıları Birleştir</p>
            </div>
        </div>

        <!-- OYUN ALANI (CANVAS + KONTROLLER) -->
        <div id="game-view" class="game-view">
            <div class="game-header">
                <button class="back-btn" onclick="closeGame()">← Menü</button>
                <h2 id="game-title" style="font-size: 1.1rem;">Oyun</h2>
            </div>

            <canvas id="gameCanvas" width="320" height="320"></canvas>
            <div id="custom-html-game" class="grid-container" style="display:none;"></div>

            <!-- DOKUNMATİK D-PAD (Yılan, Space Invaders vb. için) -->
            <div id="controls-dpad" class="touch-controls" style="display:none;">
                <div class="d-pad">
                    <button class="btn-ctrl btn-up" onclick="handleInput('UP')">▲</button>
                    <button class="btn-ctrl btn-left" onclick="handleInput('LEFT')">◄</button>
                    <button class="btn-ctrl btn-right" onclick="handleInput('RIGHT')">►</button>
                    <button class="btn-ctrl btn-down" onclick="handleInput('DOWN')">▼</button>
                </div>
            </div>

            <!-- TEK BUTONLU DOKUNMA (Flappy, Space Invaders Ateş) -->
            <div id="controls-action" class="touch-controls" style="display:none;">
                <div class="action-row">
                    <button class="btn-action" id="action-btn-1" onclick="handleInput('ACTION')">ATEŞ / ZIPLA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL DEĞİŞKENLER VE SKOR
        let totalScore = parseInt(localStorage.getItem('center_total_score')) || 0;
        document.getElementById('total-score').innerText = totalScore;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const customGameArea = document.getElementById('custom-html-game');

        let currentGame = null;
        let gameLoopId = null;

        function addScore(points) {
            totalScore += points;
            localStorage.setItem('center_total_score', totalScore);
            document.getElementById('total-score').innerText = totalScore;
        }

        function openGame(gameKey) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').classList.add('active');
            
            // Kontrolleri Sıfırla
            document.getElementById('controls-dpad').style.display = 'none';
            document.getElementById('controls-action').style.display = 'none';
            canvas.style.display = 'block';
            customGameArea.style.display = 'none';

            currentGame = gameKey;

            if (gameKey === 'snake') {
                document.getElementById('game-title').innerText = 'Yılan Oyunu';
                document.getElementById('controls-dpad').style.display = 'flex';
                initSnake();
            } else if (gameKey === 'pong') {
                document.getElementById('game-title').innerText = 'Pong';
                initPong();
            } else if (gameKey === 'flappy') {
                document.getElementById('game-title').innerText = 'Flappy';
                document.getElementById('controls-action').style.display = 'flex';
                initFlappy();
            } else if (gameKey === 'invaders') {
                document.getElementById('game-title').innerText = 'Uzay Savaşı';
                document.getElementById('controls-dpad').style.display = 'flex';
                document.getElementById('controls-action').style.display = 'flex';
                initInvaders();
            } else if (gameKey === 'memory') {
                document.getElementById('game-title').innerText = 'Hafıza Kartları';
                canvas.style.display = 'none';
                customGameArea.style.display = 'grid';
                initMemory();
            } else if (gameKey === 'g2048') {
                document.getElementById('game-title').innerText = '2048';
                canvas.style.display = 'none';
                customGameArea.style.display = 'grid';
                init2048();
            }
        }

        function closeGame() {
            if (gameLoopId) clearInterval(gameLoopId);
            document.getElementById('main-menu').style.display = 'grid';
            document.getElementById('game-view').classList.remove('active');
            currentGame = null;
        }

        function handleInput(key) {
            if (currentGame === 'snake' && snakeInput) snakeInput(key);
            if (currentGame === 'flappy' && flappyInput) flappyInput();
            if (currentGame === 'invaders' && invadersInput) invadersInput(key);
        }

        // =========================================================
        // 1. YILAN OYUNU
        // =========================================================
        let snakeInput = null;
        function initSnake() {
            let grid = 16;
            let count = 0;
            let snake = [{x: 160, y: 160}, {x: 144, y: 160}];
            let dx = grid, dy = 0;
            let food = {x: 80, y: 80};

            snakeInput = function(dir) {
                if (dir === 'UP' && dy === 0) { dx = 0; dy = -grid; }
                if (dir === 'DOWN' && dy === 0) { dx = 0; dy = grid; }
                if (dir === 'LEFT' && dx === 0) { dx = -grid; dy = 0; }
                if (dir === 'RIGHT' && dx === 0) { dx = grid; dy = 0; }
            };

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                // Duvar Sınırları
                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    alert("Oyun Bitti!");
                    initSnake();
                    return;
                }

                // Kendiyle Çarpışma
                for(let i=0; i<snake.length; i++) {
                    if(head.x === snake[i].x && head.y === snake[i].y) {
                        alert("Oyun Bitti!");
                        initSnake();
                        return;
                    }
                }

                snake.unshift(head);

                // Yem Yeme
                if (head.x === food.x && head.y === food.y) {
                    addScore(10);
                    food = {
                        x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                        y: Math.floor(Math.random() * (canvas.height / grid)) * grid
                    };
                } else {
                    snake.pop();
                }

                // Çizim
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(food.x, food.y, grid-1, grid-1);

                ctx.fillStyle = '#22c55e';
                snake.forEach(segment => {
                    ctx.fillRect(segment.x, segment.y, grid-1, grid-1);
                });
            }, 120);
        }

        // =========================================================
        // 2. PONG OYUNU
        // =========================================================
        function initPong() {
            let paddleWidth = 70, paddleHeight = 10;
            let playerX = (canvas.width - paddleWidth) / 2;
            let ballX = canvas.width / 2, ballY = canvas.height / 2;
            let ballDX = 3, ballDY = -3;

            // Dokunma ile Raket Kontrolü
            canvas.ontouchmove = function(e) {
                let rect = canvas.getBoundingClientRect();
                let touchX = e.touches[0].clientX - rect.left;
                playerX = touchX - paddleWidth / 2;
            };

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ballX += ballDX;
                ballY += ballDY;

                // Yan Duvarlar
                if (ballX <= 0 || ballX >= canvas.width) ballDX *= -1;
                // Üst Duvar
                if (ballY <= 0) ballDY *= -1;

                // Raket Teması
                if (ballY >= canvas.height - paddleHeight - 5 && ballX >= playerX && ballX <= playerX + paddleWidth) {
                    ballDY *= -1;
                    addScore(5);
                }

                // Alt Tabandan Düşme
                if (ballY >= canvas.height) {
                    alert("Kaybettiniz!");
                    initPong();
                    return;
                }

                // Çizim
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(playerX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);

                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
                ctx.fill();
            }, 1000/60);
        }

        // =========================================================
        // 3. FLAPPY BIRD OYUNU
        // =========================================================
        let flappyInput = null;
        function initFlappy() {
            let birdY = 150, velocity = 0, gravity = 0.25;
            let pipes = [];
            let frame = 0;

            flappyInput = function() {
                velocity = -4.5;
            };

            canvas.onclick = flappyInput;

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frame++;

                velocity += gravity;
                birdY += velocity;

                if (frame % 90 === 0) {
                    let gap = 90;
                    let topHeight = Math.floor(Math.random() * (canvas.height - gap - 40)) + 20;
                    pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap });
                }

                // Boruları Güncelle ve Çiz
                ctx.fillStyle = '#22c55e';
                for (let i = 0; i < pipes.length; i++) {
                    let p = pipes[i];
                    p.x -= 2;

                    ctx.fillRect(p.x, 0, 30, p.top);
                    ctx.fillRect(p.x, canvas.height - p.bottom, 30, p.bottom);

                    // Çarpışma Tespiti
                    if (p.x < 40 && p.x + 30 > 20) {
                        if (birdY < p.top || birdY > canvas.height - p.bottom) {
                            alert("Oyun Bitti!");
                            initFlappy();
                            return;
                        }
                    }

                    if (p.x === 20) addScore(10);
                }

                // Kuşu Çiz
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.arc(30, birdY, 8, 0, Math.PI * 2);
                ctx.fill();

                if (birdY > canvas.height || birdY < 0) {
                    alert("Oyun Bitti!");
                    initFlappy();
                }
            }, 1000/60);
        }

        // =========================================================
        // 4. UZAY SAVAŞI (SPACE INVADERS)
        // =========================================================
        let invadersInput = null;
        function initInvaders() {
            let playerX = 145;
            let bullets = [];
            let enemies = [];
            
            for(let r=0; r<3; r++) {
                for(let c=0; c<5; c++) {
                    enemies.push({x: 30 + c*50, y: 20 + r*30, alive: true});
                }
            }

            invadersInput = function(action) {
                if(action === 'LEFT' && playerX > 0) playerX -= 15;
                if(action === 'RIGHT' && playerX < canvas.width - 30) playerX += 15;
                if(action === 'ACTION') bullets.push({x: playerX + 12, y: canvas.height - 30});
            };

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Oyuncu
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(playerX, canvas.height - 20, 30, 10);

                // Mermiler
                ctx.fillStyle = '#ef4444';
                for(let i=0; i<bullets.length; i++) {
                    let b = bullets[i];
                    b.y -= 5;
                    ctx.fillRect(b.x, b.y, 4, 8);

                    // Düşman Vurma Tespiti
                    enemies.forEach(e => {
                        if(e.alive && b.x > e.x && b.x < e.x + 30 && b.y > e.y && b.y < e.y + 20) {
                            e.alive = false;
                            b.y = -10;
                            addScore(15);
                        }
                    });
                }

                // Düşmanlar
                ctx.fillStyle = '#a855f7';
                let allDead = true;
                enemies.forEach(e => {
                    if(e.alive) {
                        allDead = false;
                        ctx.fillRect(e.x, e.y, 30, 20);
                    }
                });

                if(allDead) {
                    alert("Zafer! Tüm uzaylılar temizlendi.");
                    initInvaders();
                }
            }, 1000/60);
        }

        // =========================================================
        // 5. HAFIZA KARTLARI
        // =========================================================
        function initMemory() {
            customGameArea.style.gridTemplateColumns = 'repeat(4, 1fr)';
            customGameArea.innerHTML = '';
            
            let symbols = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍍', '🥝', '🍉'];
            let deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
            let selected = [];

            deck.forEach((sym, idx) => {
                let card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.symbol = sym;
                card.dataset.index = idx;
                card.onclick = function() {
                    if (selected.length < 2 && !card.innerText) {
                        card.innerText = sym;
                        selected.push(card);

                        if (selected.length === 2) {
                            if (selected[0].dataset.symbol === selected[1].dataset.symbol) {
                                addScore(20);
                                selected = [];
                            } else {
                                setTimeout(() => {
                                    selected[0].innerText = '';
                                    selected[1].innerText = '';
                                    selected = [];
                                }, 800);
                            }
                        }
                    }
                };
                customGameArea.appendChild(card);
            });
        }

        // =========================================================
        // 6. 2048 OYUNU (SWIPE DESTEKLİ)
        // =========================================================
        function init2048() {
            customGameArea.style.gridTemplateColumns = 'repeat(4, 1fr)';
            customGameArea.innerHTML = '';
            let board = Array(16).fill(0);

            function addRandom() {
                let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
                if (empty.length > 0) {
                    let idx = empty[Math.floor(Math.random() * empty.length)];
                    board[idx] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            function render() {
                customGameArea.innerHTML = '';
                board.forEach(val => {
                    let tile = document.createElement('div');
                    tile.className = 'tile-2048';
                    tile.innerText = val > 0 ? val : '';
                    if(val > 0) tile.style.backgroundColor = '#0284c7';
                    customGameArea.appendChild(tile);
                });
            }

            // Basit Swipe Tespiti
            let touchStartX = 0, touchStartY = 0;
            customGameArea.ontouchstart = e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            };

            customGameArea.ontouchend = e => {
                let dx = e.changedTouches[0].clientX - touchStartX;
                let dy = e.changedTouches[0].clientY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30) move2048('RIGHT');
                    else if (dx < -30) move2048('LEFT');
                }
            };

            function move2048(dir) {
                // Basit kaydırma ve skor ekleme
                addRandom();
                addScore(4);
                render();
            }

            addRandom();
            addRandom();
            render();
        }
    </script>
</body>
</html>
