<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Uyarısı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            position: fixed;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        /* Yanıp Sönen Kırmızı Alarm */
        @keyframes red-alert {
            0% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
            50% { box-shadow: 0 0 35px #ff0000; border-color: #ffffff; background: rgba(30, 0, 0, 0.98); }
            100% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
        }

        /* Ekran Beyaz Flaş Çakma Efekti */
        #screen-flash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 10000;
            pointer-events: none;
        }

        .warning-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(10, 10, 10, 0.98);
            border: 2px solid #ff0000;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            color: white;
            animation: red-alert 0.5s infinite;
        }
        .warning-title {
            color: #ff3333;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 8px #ff0000;
        }
        .warning-text {
            font-size: 12px;
            line-height: 1.3;
            margin-bottom: 10px;
            color: #dddddd;
        }

        /* İlerleme Çubuğu */
        .progress-container {
            width: 100%;
            background-color: #111;
            border-radius: 5px;
            border: 1px solid #ff3333;
            margin: 10px 0 5px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 12px;
            background: linear-gradient(90deg, #ff9900, #ff0000);
            transition: width 0.3s;
        }

        /* Akan Sahte Dosya Yazıları */
        .file-status {
            font-size: 10px;
            color: #00ff00;
            height: 15px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 10px;
            text-align: left;
            opacity: 0.8;
        }

        .timer-container {
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255, 0, 0, 0.2);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #ff3333;
        }

        /* Tam Ekran Jumpscare Katmanı */
        #fullscreen-jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #000;
        }
        #jumpscareVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #joke-content {
            display: none;
        }
        .joke-title {
            color: #00ff00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 15px;
        }
        .joke-text {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.5;
        }
        
        /* BEYAZLARI SİYAH YAPAN RESİM KUTUSU */
        .joke-image-container {
            background-color: #000000;
            border-radius: 8px;
            border: 2px solid #00ff00;
            padding: 10px;
            margin-top: 15px;
            display: inline-block;
            width: 100%;
            max-width: 250px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .joke-image {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
            /* Resimdeki beyaz alanları siyah yapan CSS filtreleri */
            mix-blend-mode: multiply;
            filter: grayscale(100%) contrast(200%) invert(0%);
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <!-- Flaş Çakma Efekti Katmanı -->
    <div id="screen-flash"></div>

    <!-- Tam Ekran Jumpscare Video Elementi -->
    <div id="fullscreen-jumpscare">
        <video id="jumpscareVideo" preload="auto">
            <source src="korku.mp4" type="video/mp4">
        </video>
    </div>

    <div class="warning-box" id="warningBox">
        <!-- 1. Aşama: Korkutucu Uyarı & Simülasyon -->
        <div id="scary-content">
            <div class="warning-title">🚨 KRİTİK GÜVENLİK İHLALİ 🚨</div>
            <div class="warning-text">
                Cihaz belleği biçimlendiriliyor.<br>
                Lütfen telefonu kapatmayın!
            </div>

            <!-- İlerleme Çubuğu ve Yüzde -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div style="font-size: 11px; color: #ffcc00; margin-bottom: 5px;">
                Siliniyor: <span id="percentText">0%</span>
            </div>

            <!-- Akan Dosya Yazısı -->
            <div class="file-status" id="fileStatus">> /system/root_access...</div>

            <div class="timer-container">
                Tam Sıfırlamaya:<br>
                <span id="timer" style="font-size: 22px; color: #ff0000;">10</span> saniye
            </div>
        </div>

        <!-- 2. Aşama: Şaka Ekranı -->
        <div id="joke-content">
            <div class="joke-title">YAKALANDIN! 😱</div>
            <div class="joke-text">
                Telefonuna hiçbir şey olmadı, tamamen şakaydı! ❤️
            </div>
            <div class="joke-image-container">
                <img src="f50fb156e606ef622e4d6f1bbe63e4bf.jpg" alt="Şaka Görseli" class="joke-image">
            </div>
        </div>
    </div>

    <script>
        // 1. Kamera Feneri (Flaş) Donanım Kontrolü
        let videoTrack = null;
        async function initCameraFlash() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoTrack = stream.getVideoTracks()[0];
            } catch (e) {
                console.log("Flaş erişimi sağlanamadı:", e);
            }
        }
        initCameraFlash();

        function setFlashState(state) {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                videoTrack.applyConstraints({
                    advanced: [{ torch: state }]
                }).catch(e => console.log(e));
            }
        }

        // Flaş & Ekran Şimşek Efekti
        const screenFlash = document.getElementById('screen-flash');
        function doStrobeEffect(durationMs) {
            let isOn = false;
            const interval = setInterval(() => {
                isOn = !isOn;
                setFlashState(isOn);
                screenFlash.style.display = isOn ? 'block' : 'none';
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                setFlashState(false);
                screenFlash.style.display = 'none';
            }, durationMs);
        }

        // 2. Matrix Yağmuru Efekti
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initDrops();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // 3. Sahte Dosya İsimleri
        const fakeFiles = [
            "> DCIM/Camera/IMG_2026.jpg silindi",
            "> WhatsApp/Databases/msgstore.db silindi",
            "> System/Kişiler_Yedek.vcf kaldırılıyor...",
            "> Internal/Downloads/Bank_Data.pdf silindi",
            "> Gallery/Private/Secret_01.mp4 temizlendi",
            "> Android/data/com.whatsapp/cache silindi",
            "> System32/Drivers/Secure_Vault.bin silindi"
        ];

        let timeLeft = 10;
        let progress = 0;
        const timerElement = document.getElementById('timer');
        const progressBar = document.getElementById('progressBar');
        const percentText = document.getElementById('percentText');
        const fileStatus = document.getElementById('fileStatus');
        
        const scaryContent = document.getElementById('scary-content');
        const jokeContent = document.getElementById('joke-content');
        const jumpscareOverlay = document.getElementById('fullscreen-jumpscare');
        const jumpscareVideo = document.getElementById('jumpscareVideo');

        // Geri Sayım Mantığı
        const countdown = setInterval(() => {
            timeLeft--;
            
            // Yüzde ve İlerleme Çubuğu
            progress += 10;
            if (progress > 100) progress = 100;
            progressBar.style.width = progress + '%';
            percentText.innerText = progress + '%';

            // Dosya Adları
            const randomFile = fakeFiles[Math.floor(Math.random() * fakeFiles.length)];
            fileStatus.innerText = randomFile;

            if (timerElement) {
                timerElement.innerText = timeLeft;
            }

            // Son 3 Saniyede Titreşim ve Flaş
            if (timeLeft <= 3 && timeLeft > 0) {
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
                doStrobeEffect(250);
            }

            // Süre Dolduğunda Jumpscare Başlat
            if (timeLeft <= 0) {
                clearInterval(countdown);

                // Titreşim ve Flaş Çakımı
                if (navigator.vibrate) {
                    navigator.vibrate([1000, 100, 1000]);
                }
                doStrobeEffect(2000);

                // Videoyu Aç ve Oynat
                jumpscareOverlay.style.display = 'block';

                if (jumpscareVideo) {
                    jumpscareVideo.play().catch(e => console.log("Video hatası:", e));
                    
                    jumpscareVideo.onended = function() {
                        jumpscareOverlay.style.display = 'none';
                        scaryContent.style.display = 'none';
                        jokeContent.style.display = 'block';
                        setFlashState(false);
                    };
                }
            }
        }, 1000);
    </script>
</body>
</html>
