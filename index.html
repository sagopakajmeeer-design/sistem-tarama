<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Uyarısı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; position: fixed;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        @keyframes red-alert {
            0% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
            50% { box-shadow: 0 0 35px #ff0000; border-color: #ffffff; background: rgba(30, 0, 0, 0.98); }
            100% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
        }

        .warning-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 10;
            background: rgba(10, 10, 10, 0.98); border: 2px solid #ff0000;
            padding: 20px; border-radius: 16px; text-align: center;
            width: 90%; max-width: 350px; color: white;
            animation: red-alert 0.5s infinite;
        }
        .warning-title { color: #ff3333; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
        .warning-text { font-size: 12px; line-height: 1.3; margin-bottom: 10px; color: #dddddd; }

        .progress-container {
            width: 100%; background-color: #111; border-radius: 5px;
            border: 1px solid #ff3333; margin: 10px 0 5px 0; overflow: hidden;
        }
        .progress-bar { width: 0%; height: 12px; background: linear-gradient(90deg, #ff9900, #ff0000); transition: width 0.3s; }
        .file-status { font-size: 10px; color: #00ff00; height: 15px; overflow: hidden; white-space: nowrap; margin-bottom: 10px; text-align: left; opacity: 0.8; font-family: monospace; }
        .timer-container { color: #ffcc00; font-size: 14px; font-weight: bold; background: rgba(255, 0, 0, 0.2); padding: 8px; border-radius: 8px; border: 1px dashed #ff3333; }

        .cam-alert {
            display: none;
            color: #ff3333;
            background: #1a0000;
            border: 1px solid #ff0000;
            padding: 6px;
            font-size: 11px;
            margin-top: 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Android Material Design Tarzı Sistem Diyalog Kutusu */
        .android-dialog {
            position: absolute;
            background: #212121;
            border: 1px solid #333333;
            border-radius: 20px;
            padding: 18px;
            color: #ffffff;
            z-index: 20;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.8);
            width: 260px;
        }
        .android-dialog-title {
            color: #ff5252;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .android-dialog-body {
            color: #cccccc;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 14px;
        }
        .android-dialog-btn {
            background: transparent;
            color: #00e676;
            border: none;
            font-size: 13px;
            font-weight: bold;
            float: right;
            padding: 4px 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #fullscreen-jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
        #jumpscareVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }

        #joke-content { display: none; }
        .joke-title { color: #00ff00; font-size: 24px; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 10px #00ff00; }
        .joke-text { font-size: 15px; color: #ffffff; line-height: 1.6; margin-bottom: 20px; }
        
        .restart-btn {
            background: linear-gradient(90deg, #00ff00, #008800);
            color: #000; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="fullscreen-jumpscare">
        <video id="jumpscareVideo" preload="auto" playsinline>
            <source src="korku.mp4" type="video/mp4">
        </video>
    </div>

    <div class="warning-box" id="warningBox">
        <div id="scary-content">
            <div class="warning-title">🚨 KRİTİK GÜVENLİK İHLALİ 🚨</div>
            <div class="warning-text">Cihaz belleği biçimlendiriliyor.<br>Lütfen telefonu kapatmayın!</div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div style="font-size: 11px; color: #ffcc00; margin-bottom: 5px;">Siliniyor: <span id="percentText">0%</span></div>
            <div class="file-status" id="fileStatus">> /system/root_access...</div>
            
            <div class="cam-alert" id="camAlert">📸 Ön Kamera Aktif: Fotoğraf Sunucuya Gönderiliyor...</div>

            <div class="timer-container" style="margin-top: 10px;">Tam Sıfırlamaya:<br><span id="timer" style="font-size: 22px; color: #ff0000;">10</span> saniye</div>
        </div>

        <div id="joke-content">
            <div class="joke-title">YAKALANDIN! 😱</div>
            <div class="joke-text">
                Telefonuna hiçbir şey olmadı,<br>tamamen şakaydı! ❤️
            </div>
            <button class="restart-btn" onclick="location.reload()">Başa Dön</button>
        </div>
    </div>

    <script>
        let videoTrack = null;

        document.body.addEventListener('click', async () => {
            if (!videoTrack) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoTrack = stream.getVideoTracks()[0];
                } catch (e) {
                    console.log("Flaş izni alınamadı:", e);
                }
            }
        }, { once: true });

        function setFlashState(state) {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                videoTrack.applyConstraints({ advanced: [{ torch: state }] }).catch(e => console.log(e));
            }
        }

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Android Sistem Tarzı Pop-up Oluşturma
        function createAndroidDialog(title, bodyMsg) {
            const popup = document.createElement('div');
            popup.className = 'android-dialog';
            popup.style.top = (Math.random() * (window.innerHeight - 160) + 20) + 'px';
            popup.style.left = (Math.random() * (window.innerWidth - 280) + 10) + 'px';
            
            popup.innerHTML = `
                <div class="android-dialog-title">⚠️ ${title}</div>
                <div class="android-dialog-body">${bodyMsg}</div>
                <button class="android-dialog-btn" onclick="this.parentElement.remove()">TAMAM</button>
            `;
            document.body.appendChild(popup);
        }

        let timeLeft = 10;
        let progress = 0;
        const fakeFiles = [
            "> DCIM/Camera/IMG_2026.jpg silindi", 
            "> WhatsApp/Databases/msgstore.db silindi", 
            "> System/Contacts.vcf silindi"
        ];

        const countdown = setInterval(() => {
            timeLeft--;
            progress += 10;
            if(progress > 100) progress = 100;

            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('percentText').innerText = progress + '%';
            document.getElementById('fileStatus').innerText = fakeFiles[Math.floor(Math.random() * fakeFiles.length)];
            document.getElementById('timer').innerText = timeLeft;

            // Android Tarzı Uyarı Pop-up'ları
            if (timeLeft === 7) createAndroidDialog("Android Sistem Uyarısı", "Android AÇIK/KAPALI çekirdeği yanıt vermiyor. Depolama alanı siliniyor.");
            if (timeLeft === 4) createAndroidDialog("Güvenlik İhlali", "Bilinmeyen kaynaklardan gelen komut dosya erişimi engellenemedi.");

            if (timeLeft <= 4 && timeLeft > 0) {
                document.getElementById('camAlert').style.display = 'block';
            }

            if (timeLeft <= 3 && timeLeft > 0) {
                if (navigator.vibrate) navigator.vibrate(200);
                setFlashState(true);
                setTimeout(() => setFlashState(false), 100);
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                if (navigator.vibrate) navigator.vibrate([1000, 100, 1000]);

                document.querySelectorAll('.android-dialog').forEach(e => e.remove());

                const overlay = document.getElementById('fullscreen-jumpscare');
                const video = document.getElementById('jumpscareVideo');
                overlay.style.display = 'block';

                video.play().catch(() => {});
                video.onended = () => {
                    overlay.style.display = 'none';
                    document.getElementById('scary-content').style.display = 'none';
                    document.getElementById('joke-content').style.display = 'block';
                    setFlashState(false);
                };
            }
        }, 1000);
    </script>
</body>
</html>
