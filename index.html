<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Süper Oyun Merkezi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* ANA MENÜ EKRANI */
        #main-menu {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .menu-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        .game-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background 0.2s;
        }

        .game-card:active {
            transform: scale(0.98);
            background: #334155;
        }

        /* GİZLİ SAKIN TIKLAMA BUTONU */
        .secret-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #dc2626;
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
            animation: pulseSecret 1.5s infinite alternate;
            cursor: pointer;
            z-index: 20;
        }

        @keyframes pulseSecret {
            0% { transform: scale(1); box-shadow: 0 0 5px #dc2626; }
            100% { transform: scale(1.08); box-shadow: 0 0 15px #dc2626; }
        }

        /* ŞAKA / VİRÜS EKRANI */
        #prank-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff0000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .crack-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: 
                linear-gradient(45deg, transparent 49%, rgba(255,0,0,0.4) 50%, transparent 51%),
                linear-gradient(-45deg, transparent 48%, rgba(255,0,0,0.3) 50%, transparent 52%);
            background-size: 100px 100px;
            opacity: 0.6;
        }

        .alert-box {
            border: 2px solid #ff0000;
            padding: 25px;
            background: rgba(20, 0, 0, 0.9);
            box-shadow: 0 0 30px #ff0000;
            border-radius: 10px;
            max-width: 90%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #ff0000; }
            100% { box-shadow: 0 0 35px #ff0000; }
        }

        .alert-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .alert-text {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 15px;
            background-color: #ff0000;
            transition: width 0.3s linear;
        }

        /* ANDROID BİLDİRİMLERİ */
        .notification-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            border-left: 4px solid #0088cc;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .notif-icon { font-size: 20px; }
        .notif-content { display: flex; flex-direction: column; }
        .notif-title { font-weight: bold; color: #e0e0e0; }
        .notif-desc { color: #b0b0b0; font-size: 12px; }

        /* JUMPSCARE EKRANI */
        #jumpscare-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 20000;
            justify-content: center;
            align-items: center;
            animation: flashOverlay 0.1s infinite alternate;
        }

        @keyframes flashOverlay {
            0% { background-color: #000; }
            100% { background-color: #300; }
        }

        .scary-face {
            width: 90%;
            max-width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ff0000 10%, #000000 70%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px #ff0000;
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(1deg); }
            100% { transform: translate(2px, -2px) rotate(-1deg); }
        }

        .scary-eyes {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .eye {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #fff;
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
        }

        .scary-mouth {
            width: 120px;
            height: 60px;
            background: #000;
            border-radius: 0 0 60px 60px;
            border: 3px solid #ff0000;
        }
    </style>
</head>
<body>

    <!-- GİZLİ SAKIN TIKLAMA BUTONU -->
    <button class="secret-btn" id="secretBtn">🚨 SAKIN TIKLAMA!</button>

    <!-- ANA MENÜ -->
    <div id="main-menu">
        <div class="menu-title">🎮 OYUN MERKEZİ</div>
        <div class="game-list">
            <div class="game-card" onclick="startPrankFromMenu()">
                <span>🚀 Space Fighter</span>
                <span>▶</span>
            </div>
            <div class="game-card" onclick="startPrankFromMenu()">
                <span>🏎️ Retro Racer</span>
                <span>▶</span>
            </div>
            <div class="game-card" onclick="startPrankFromMenu()">
                <span>🐍 Snake Classic</span>
                <span>▶</span>
            </div>
        </div>
    </div>

    <!-- BİLDİRİMLER -->
    <div class="notification-container" id="notifArea"></div>

    <!-- ŞAKA BÖLÜMÜ -->
    <div id="prank-screen">
        <div class="crack-overlay"></div>
        <div class="alert-box">
            <div class="alert-title">⚠️ SİSTEM İHLALİ TESPİT EDİLDİ ⚠️</div>
            <div class="alert-text">
                Cihaz güvenlik protokolleri aşıldı.<br>
                Tüm veriler, fotoğraflar ve sistem dosyaları siliniyor...
            </div>
            <div style="font-size: 14px; color: #ff8800; margin-bottom: 5px;">Sıfırlanıyor: <span id="pCount">0</span>%</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="pBar"></div>
            </div>
        </div>
    </div>

    <!-- JUMPSCARE EKRANI -->
    <div id="jumpscare-overlay">
        <div class="scary-face">
            <div class="scary-eyes">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="scary-mouth"></div>
        </div>
    </div>

    <script>
        // WEB AUDIO SES EFEKTLERİ
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'alarm') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'scream') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.8);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }

        // TIKLAMA DİNLEYİCİLERİ
        document.getElementById('secretBtn').addEventListener('click', () => {
            initAudio();
            triggerPrank();
        });

        function startPrankFromMenu() {
            initAudio();
            triggerPrank();
        }

        // ŞAKA EKRANI TETİKLENMESİ
        function triggerPrank() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('secretBtn').style.display = 'none';
            document.getElementById('prank-screen').style.display = 'flex';

            if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

            let progress = 0;
            const pBar = document.getElementById('pBar');
            const pCount = document.getElementById('pCount');

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 3;
                if (progress > 100) progress = 100;

                pBar.style.width = progress + '%';
                pCount.innerText = progress;

                if (navigator.vibrate) navigator.vibrate(80);

                if (progress >= 100) {
                    clearInterval(interval);
                    showNotifications();
                }
            }, 250);
        }

        // BİLDİRİMLER VE JUMPSCARE
        function showNotifications() {
            const notifArea = document.getElementById('notifArea');

            const notifications = [
                { icon: '🏦', title: 'Garanti BBVA', desc: 'Hesabınızdan 14.500 TL çıkış yapıldı.' },
                { icon: '💬', title: 'WhatsApp', desc: 'Kod doğrulama talebiniz alındı.' }
            ];

            notifications.forEach((notif, index) => {
                setTimeout(() => {
                    playSound('alarm');
                    if (navigator.vibrate) navigator.vibrate(200);

                    const el = document.createElement('div');
                    el.className = 'notification';
                    el.innerHTML = `
                        <div class="notif-icon">${notif.icon}</div>
                        <div class="notif-content">
                            <div class="notif-title">${notif.title}</div>
                            <div class="notif-desc">${notif.desc}</div>
                        </div>
                    `;
                    notifArea.appendChild(el);
                }, index * 1200);
            });

            setTimeout(() => {
                triggerJumpscare();
            }, 3000);
        }

        function triggerJumpscare() {
            document.getElementById('prank-screen').style.display = 'none';
            document.getElementById('notifArea').style.display = 'none';
            document.getElementById('jumpscare-overlay').style.display = 'flex';

            playSound('scream');
            if (navigator.vibrate) navigator.vibrate([1000, 100, 1000]);
        }
    </script>
</body>
</html>
