<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Uyarısı</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: black;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Glitch / Titreme Efekti */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }

    .warning-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #ff0000;
      box-shadow: 0 0 25px #ff0000;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 85%;
      max-width: 380px;
      color: white;
      animation: glitch 0.3s infinite alternate;
    }

    .warning-title {
      color: #ff3333;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px #ff0000;
    }

    .warning-text {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
      color: #dddddd;
    }

    .timer-container {
      color: #ffcc00;
      font-size: 18px;
      font-weight: bold;
      background: rgba(255, 0, 0, 0.2);
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #ff3333;
    }

    .joke-reveal {
      display: none;
      color: #00ff00;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff00;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="warning-box">
    <div id="scary-content">
      <div class="warning-title">⚠️ KRİTİK SİSTEM HATASI ⚠️</div>
      <div class="warning-text">
        Cihazınıza izinsiz erişim sağlandı.<br>
        Tüm kişisel verileriniz siliniyor!
      </div>
      <div class="timer-container">
        Sistemin Sıfırlanmasına: <br>
        <span id="timer" style="font-size: 32px; color: #ff0000;">10</span> saniye
      </div>
    </div>

    <div id="joke-content" class="joke-reveal">
      YAKALANDIN! 😜<br><br>
      <span style="font-size: 16px; color: #ffffff;">
        Telefonuna hiçbir şey olmadı, tamamen şakaydı! ❤️
      </span>
    </div>
  </div>

  <script>
    // Matrix Yağmuru Efekti
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const alphabet = katakana + latin;

    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let rainDrops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    }

    setInterval(drawMatrix, 30);

    // Geri Sayım ve Şaka Mantığı
    let timeLeft = 10;
    const timerElement = document.getElementById('timer');
    const scaryContent = document.getElementById('scary-content');
    const jokeContent = document.getElementById('joke-content');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timerElement) timerElement.innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        
        // Cihaz destekliyorsa hafif titreşim ver
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200, 100, 400]);
        }

        // Korkunç metni gizle, şaka metnini göster
        scaryContent.style.display = 'none';
        jokeContent.style.display = 'block';
      }
    }, 1000);
  </script>
</body>
</html>
