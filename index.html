<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Uyarısı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            position: fixed;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        @keyframes glitch {
            0% { transform: translate(-50%, -50%) translate(0); }
            25% { transform: translate(-50%, -50%) translate(-2px, 2px); }
            50% { transform: translate(-50%, -50%) translate(2px, -2px); }
            75% { transform: translate(-50%, -50%) translate(-1px, -1px); }
            100% { transform: translate(-50%, -50%) translate(0); }
        }
        
        /* Tam Ekran Jumpscare Katmanı */
        #fullscreen-jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #000;
        }
        #fullscreen-jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.08s infinite;
        }

        /* Korkunç Ekran Sallantısı */
        @keyframes shake {
            0% { transform: translate(0, 0) scale(1.05); }
            20% { transform: translate(-20px, 20px) scale(1.15); }
            40% { transform: translate(20px, -20px) scale(1.1); }
            60% { transform: translate(-15px, -15px) scale(1.18); }
            80% { transform: translate(15px, 15px) scale(1.08); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .warning-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            color: white;
            animation: glitch 0.2s infinite;
        }
        .warning-title {
            color: #ff3333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 0 8px #ff0000;
        }
        .warning-text {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #dddddd;
        }
        .timer-container {
            color: #ffcc00;
            font-size: 15px;
            font-weight: bold;
            background: rgba(255, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #ff3333;
        }
        #joke-content {
            display: none;
        }
        .joke-title {
            color: #00ff00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 15px;
        }
        .joke-text {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.5;
        }
        .joke-image {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <!-- Çığlık Sesi -->
    <audio id="screamSound" src="ciglik.mp3" preload="auto"></audio>

    <!-- Tam Ekran Jumpscare Görseli -->
    <div id="fullscreen-jumpscare">
        <img src="f50fb156e606ef622e4d6f1bbe63e4bf.jpg" alt="Jumpscare">
    </div>

    <div class="warning-box" id="warningBox">
        <!-- 1. Aşama: Korkutucu Uyarı -->
        <div id="scary-content">
            <div class="warning-title">⚠️ KRİTİK SİSTEM HATASI ⚠️</div>
            <div class="warning-text">
                Cihazınıza izinsiz erişim sağlandı.<br>
                Tüm verileriniz siliniyor!
            </div>
            <div class="timer-container">
                Sistemin Sıfırlanmasına:<br>
                <span id="timer" style="font-size: 24px; color: #ff0000;">10</span> saniye
            </div>
        </div>

        <!-- 2. Aşama: Şaka Ekranı (4 saniyelik jumpscare'den sonra açılacak) -->
        <div id="joke-content">
            <div class="joke-title">YAKALANDIN! 😱</div>
            <div class="joke-text">
                Telefonuna hiçbir şey olmadı, tamamen şakaydı! ❤️
            </div>
            <img src="f50fb156e606ef622e4d6f1bbe63e4bf.jpg" alt="Şaka Görseli" class="joke-image">
        </div>
    </div>

    <script>
        // Matrix Yağmuru
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initDrops();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Geri Sayım ve 4 Saniyelik Tam Ekran Jumpscare
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const scaryContent = document.getElementById('scary-content');
        const jokeContent = document.getElementById('joke-content');
        const jumpscareOverlay = document.getElementById('fullscreen-jumpscare');
        const screamSound = document.getElementById('screamSound');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timerElement) {
                timerElement.innerText = timeLeft;
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                
                // 1. Çığlık Sesini Çal
                if (screamSound) {
                    screamSound.play().catch(e => console.log("Ses çalınamadı:", e));
                }

                // 2. Güçlü Titreşim Yap
                if (navigator.vibrate) {
                    navigator.vibrate([1000, 200, 1000, 200, 1000]);
                }

                // 3. Tam Ekran Jumpscare Görselini Aç
                jumpscareOverlay.style.display = 'block';

                // 4. Tam 4 Saniye (4000 ms) Sonra Jumpscare'i Kapat ve Şaka Mesajını Göster
                setTimeout(() => {
                    jumpscareOverlay.style.display = 'none';
                    scaryContent.style.display = 'none';
                    jokeContent.style.display = 'block';
                }, 4000);
            }
        }, 1000);
    </script>
</body>
</html>
