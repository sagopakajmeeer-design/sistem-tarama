<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Uyarısı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: 'Courier New', Courier, monospace; position: fixed;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        @keyframes red-alert {
            0% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
            50% { box-shadow: 0 0 35px #ff0000; border-color: #ffffff; background: rgba(30, 0, 0, 0.98); }
            100% { box-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
        }

        .warning-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 10;
            background: rgba(10, 10, 10, 0.98); border: 2px solid #ff0000;
            padding: 20px; border-radius: 12px; text-align: center;
            width: 90%; max-width: 350px; color: white;
            animation: red-alert 0.5s infinite;
        }
        .warning-title { color: #ff3333; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
        .warning-text { font-size: 12px; line-height: 1.3; margin-bottom: 10px; color: #dddddd; }

        .progress-container {
            width: 100%; background-color: #111; border-radius: 5px;
            border: 1px solid #ff3333; margin: 10px 0 5px 0; overflow: hidden;
        }
        .progress-bar { width: 0%; height: 12px; background: linear-gradient(90deg, #ff9900, #ff0000); transition: width 0.3s; }
        .file-status { font-size: 10px; color: #00ff00; height: 15px; overflow: hidden; white-space: nowrap; margin-bottom: 10px; text-align: left; opacity: 0.8; }
        .timer-container { color: #ffcc00; font-size: 14px; font-weight: bold; background: rgba(255, 0, 0, 0.2); padding: 8px; border-radius: 6px; border: 1px dashed #ff3333; }

        /* 1. Özellik: Kamera / Fotoğraf Çekilme Uyarısı */
        .cam-alert {
            display: none;
            color: #ff0000;
            background: #000;
            border: 1px solid #ff0000;
            padding: 5px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: bold;
        }

        /* 4. Özellik: Ekranda Açılan Sahte Hata Pencereleri */
        .popup-error {
            position: absolute;
            background: #d4d0c8;
            border: 2px solid #ffffff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            padding: 10px;
            color: #000;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 20;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.7);
            width: 200px;
        }
        .popup-header {
            background: #000080;
            color: white;
            padding: 2px 5px;
            font-weight: bold;
            font-size: 10px;
            margin: -10px -10px 8px -10px;
        }

        #fullscreen-jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
        #jumpscareVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }

        #joke-content { display: none; }
        .joke-title { color: #00ff00; font-size: 24px; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 10px #00ff00; }
        .joke-text { font-size: 15px; color: #ffffff; line-height: 1.6; margin-bottom: 20px; }
        
        .restart-btn {
            background: linear-gradient(90deg, #00ff00, #008800);
            color: #000; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 5px;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="fullscreen-jumpscare">
        <video id="jumpscareVideo" preload="auto" playsinline>
            <source src="korku.mp4" type="video/mp4">
        </video>
    </div>

    <div class="warning-box" id="warningBox">
        <!-- 1. Aşama: Geri Sayım ve Simülasyon -->
        <div id="scary-content">
            <div class="warning-title">🚨 KRİTİK GÜVENLİK İHLALİ 🚨</div>
            <div class="warning-text">Cihaz belleği biçimlendiriliyor.<br>Lütfen telefonu kapatmayın!</div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div style="font-size: 11px; color: #ffcc00; margin-bottom: 5px;">Siliniyor: <span id="percentText">0%</span></div>
            <div class="file-status" id="fileStatus">> /system/root_access...</div>
            
            <!-- Sahte Kamera Uyarısı -->
            <div class="cam-alert" id="camAlert">📸 Ön Kamera Aktif: Fotoğraf Sunucuya Gönderiliyor...</div>

            <div class="timer-container" style="margin-top: 10px;">Tam Sıfırlamaya:<br><span id="timer" style="font-size: 22px; color: #ff0000;">10</span> saniye</div>
        </div>

        <!-- 2. Aşama: Şaka Mesajı -->
        <div id="joke-content">
            <div class="joke-title">YAKALANDIN! 😱</div>
            <div class="joke-text">
                Telefonuna hiçbir şey olmadı,<br>tamamen şakaydı! ❤️
            </div>
            <button class="restart-btn" onclick="location.reload()">Başa Dön</button>
        </div>
    </div>

    <script>
        let videoTrack = null;

        document.body.addEventListener('click', async () => {
            if (!videoTrack) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoTrack = stream.getVideoTracks()[0];
                } catch (e) {
                    console.log("Flaş izni alınamadı:", e);
                }
            }
        }, { once: true });

        function setFlashState(state) {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                videoTrack.applyConstraints({ advanced: [{ torch: state }] }).catch(e => console.log(e));
            }
        }

        // Matrix Yağmuru
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Sahte Hata Pencereleri Oluşturan Fonksiyon
        function createErrorPopup(msg) {
            const popup = document.createElement('div');
            popup.className = 'popup-error';
            popup.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            popup.style.left = Math.random() * (window.innerWidth - 180) + 'px';
            
            popup.innerHTML = `
                <div class="popup-header">Sistem Hatası 0x000F</div>
                <div style="margin-bottom:8px;">❌ ${msg}</div>
                <button style="float:right; padding:2px 8px;" onclick="this.parentElement.remove()">Tamam</button>
            `;
            document.body.appendChild(popup);
        }

        // Geri Sayım Mantığı
        let timeLeft = 10;
        let progress = 0;
        const fakeFiles = [
            "> DCIM/Camera/IMG_2026.jpg silindi", 
            "> WhatsApp/Databases/msgstore.db silindi", 
            "> System/Contacts.vcf silindi"
        ];

        const countdown = setInterval(() => {
            timeLeft--;
            progress += 10;
            if(progress > 100) progress = 100;

            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('percentText').innerText = progress + '%';
            document.getElementById('fileStatus').innerText = fakeFiles[Math.floor(Math.random() * fakeFiles.length)];
            document.getElementById('timer').innerText = timeLeft;

            // 5. ve 2. saniyelerde ekranda sahte pop-up hata penceresi çıksın
            if (timeLeft === 7) createErrorPopup("Kritik Bellek Doldu!");
            if (timeLeft === 4) createErrorPopup("System32/boot.ini Silindi!");

            // Son 4 saniyede Sahte Kamera Yazısı Çıksın
            if (timeLeft <= 4 && timeLeft > 0) {
                document.getElementById('camAlert').style.display = 'block';
            }

            // Son 3 saniye flaş ve titreşim
            if (timeLeft <= 3 && timeLeft > 0) {
                if (navigator.vibrate) navigator.vibrate(200);
                setFlashState(true);
                setTimeout(() => setFlashState(false), 100);
            }

            // Süre bittiğinde jumpscare başlasın
            if (timeLeft <= 0) {
                clearInterval(countdown);
                if (navigator.vibrate) navigator.vibrate([1000, 100, 1000]);

                // Açılan sahte popup'ları temizle
                document.querySelectorAll('.popup-error').forEach(e => e.remove());

                const overlay = document.getElementById('fullscreen-jumpscare');
                const video = document.getElementById('jumpscareVideo');
                overlay.style.display = 'block';

                video.play().catch(() => {});
                video.onended = () => {
                    overlay.style.display = 'none';
                    document.getElementById('scary-content').style.display = 'none';
                    document.getElementById('joke-content').style.display = 'block';
                    setFlashState(false);
                };
            }
        }, 1000);
    </script>
</body>
</html>
