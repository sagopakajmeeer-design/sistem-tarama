<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Space Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* OYUN EKRANI */
        #game-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: radial-gradient(circle, #0a0a23 0%, #000000 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        /* ŞAKA / VİRÜS EKRANI */
        #prank-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff0000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* ÇATLAIK EFEKTİ */
        .crack-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: 
                linear-gradient(45deg, transparent 49%, rgba(255,0,0,0.4) 50%, transparent 51%),
                linear-gradient(-45deg, transparent 48%, rgba(255,0,0,0.3) 50%, transparent 52%);
            background-size: 100px 100px;
            opacity: 0.6;
        }

        .alert-box {
            border: 2px solid #ff0000;
            padding: 25px;
            background: rgba(20, 0, 0, 0.9);
            box-shadow: 0 0 30px #ff0000;
            border-radius: 10px;
            max-width: 90%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #ff0000; }
            100% { box-shadow: 0 0 35px #ff0000; }
        }

        .alert-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .alert-text {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 15px;
            background-color: #ff0000;
            transition: width 0.3s linear;
        }

        /* ANDROID BİLDİRİMLERİ */
        .notification-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            border-left: 4px solid #0088cc;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .notif-icon { font-size: 20px; }
        .notif-content { display: flex; flex-direction: column; }
        .notif-title { font-weight: bold; color: #e0e0e0; }
        .notif-desc { color: #b0b0b0; font-size: 12px; }

        /* JUMPSCARE EKRANI */
        #jumpscare-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 20000;
            justify-content: center;
            align-items: center;
            animation: flashOverlay 0.1s infinite alternate;
        }

        @keyframes flashOverlay {
            0% { background-color: #000; }
            100% { background-color: #300; }
        }

        .scary-face {
            width: 90%;
            max-width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ff0000 10%, #000000 70%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px #ff0000;
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(1deg); }
            100% { transform: translate(2px, -2px) rotate(-1deg); }
        }

        .scary-eyes {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .eye {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #fff;
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
        }

        .scary-mouth {
            width: 120px;
            height: 60px;
            background: #000;
            border-radius: 0 0 60px 60px;
            border: 3px solid #ff0000;
        }
    </style>
</head>
<body>

    <!-- OYUN BÖLÜMÜ -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- BİLDİRİMLER -->
    <div class="notification-container" id="notifArea"></div>

    <!-- ŞAKA BÖLÜMÜ -->
    <div id="prank-screen">
        <div class="crack-overlay"></div>
        <div class="alert-box">
            <div class="alert-title">⚠️ SİSTEM İHLALİ TESPİT EDİLDİ ⚠️</div>
            <div class="alert-text">
                Cihaz güvenlik protokolleri aşıldı.<br>
                Tüm veriler, fotoğraflar ve sistem dosyaları siliniyor...
            </div>
            <div style="font-size: 14px; color: #ff8800; margin-bottom: 5px;">Sıfırlanıyor: <span id="pCount">0</span>%</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="pBar"></div>
            </div>
        </div>
    </div>

    <!-- JUMPSCARE EKRANI -->
    <div id="jumpscare-overlay">
        <div class="scary-face">
            <div class="scary-eyes">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="scary-mouth"></div>
        </div>
    </div>

    <script>
        // WEB AUDIO SES EFEKTLERİ
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'scream') {
                // Jumpscare Çığlık Efekti
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.8);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }

        // CANVAS AYARLARI
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 450);
            canvas.height = Math.min(window.innerHeight, 700);
        }
        resizeCanvas();

        // OYUN DEĞİŞKENLERİ
        let score = 0;
        let lives = 3; // Oyuncu Canı
        let gameOver = false;
        let bossActive = false;

        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 70,
            w: 40,
            h: 40,
            speed: 6,
            dx: 0
        };

        let bullets = [];
        let enemies = [];
        let bossBullets = [];

        let boss = {
            x: canvas.width / 2 - 40,
            y: -100,
            w: 80,
            h: 60,
            hp: 20,
            maxHp: 20,
            speedX: 2,
            active: false
        };

        // KONTROLLER
        window.addEventListener('touchstart', (e) => {
            initAudio();
            const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < canvas.width / 2) player.dx = -player.speed;
            else player.dx = player.speed;
        });

        window.addEventListener('touchend', () => player.dx = 0);

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
            if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
        });

        window.addEventListener('keyup', () => player.dx = 0);

        // ATEŞ ETME
        setInterval(() => {
            if (!gameOver) {
                bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 12 });
                playSound('laser');
            }
        }, 250);

        // DÜŞMAN ÜRETİMİ
        setInterval(() => {
            if (!gameOver && !bossActive) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    w: 30,
                    h: 30,
                    speed: 2 + Math.random() * 2
                });
            }
        }, 900);

        // BOSS SALDIRISI
        setInterval(() => {
            if (bossActive && !gameOver) {
                bossBullets.push({
                    x: boss.x + boss.w / 2 - 4,
                    y: boss.y + boss.h,
                    w: 8,
                    h: 15,
                    speed: 4
                });
            }
        }, 1100);

        function takeDamage() {
            lives--;
            playSound('hit');
            if (navigator.vibrate) navigator.vibrate(150);

            if (lives <= 0) {
                triggerPrank();
            }
        }

        // OYUN DÖNGÜSÜ
        function update() {
            if (gameOver) return;

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // Mermiler
            bullets.forEach((b, index) => {
                b.y -= 8;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Düşmanlar
            enemies.forEach((e, eIdx) => {
                e.y += e.speed;

                // Düşman-Oyuncu Çarpışması
                if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
                    enemies.splice(eIdx, 1);
                    takeDamage();
                }

                // Mermi-Düşman Çarpışması
                bullets.forEach((b, bIdx) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(eIdx, 1);
                        bullets.splice(bIdx, 1);
                        score += 10;
                        playSound('explosion');

                        if (score >= 100 && !bossActive) {
                            bossActive = true;
                            boss.active = true;
                        }
                    }
                });

                if (e.y > canvas.height) enemies.splice(eIdx, 1);
            });

            // BOSS MANTIĞI
            if (bossActive) {
                if (boss.y < 50) boss.y += 1;
                else {
                    boss.x += boss.speedX;
                    if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.speedX *= -1;
                }

                // Mermi-Boss Çarpışması
                bullets.forEach((b, bIdx) => {
                    if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
                        boss.hp--;
                        bullets.splice(bIdx, 1);
                        playSound('explosion');

                        if (boss.hp <= 0) {
                            bossActive = false;
                            triggerPrank();
                        }
                    }
                });
            }

            // Boss Mermileri
            bossBullets.forEach((bb, bbIdx) => {
                bb.y += bb.speed;

                // Boss Mermisi - Oyuncu Çarpışması
                if (bb.x < player.x + player.w && bb.x + bb.w > player.x && bb.y < player.y + player.h && bb.y + bb.h > player.y) {
                    bossBullets.splice(bbIdx, 1);
                    takeDamage();
                }

                if (bb.y > canvas.height) bossBullets.splice(bbIdx, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Oyuncu (Yeşil Gemi)
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.closePath();
            ctx.fill();

            // Mermiler
            ctx.fillStyle = '#00ffff';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Düşmanlar
            ctx.fillStyle = '#ff0055';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

            // Boss
            if (bossActive) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(boss.x, boss.y - 15, boss.w, 6);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(boss.x, boss.y - 15, (boss.w * boss.hp) / boss.maxHp, 6);
            }

            // Boss Mermileri
            ctx.fillStyle = '#ffff00';
            bossBullets.forEach(bb => ctx.fillRect(bb.x, bb.y, bb.w, bb.h));

            // Skor ve Can Göstergesi
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px sans-serif';
            ctx.fillText('Skor: ' + score, 15, 30);
            
            let hearts = '';
            for(let i=0; i<lives; i++) hearts += '❤️ ';
            ctx.fillText('Can: ' + hearts, canvas.width - 120, 30);
        }

        function loop() {
            update();
            draw();
            if (!gameOver) requestAnimationFrame(loop);
        }
        loop();

        // ŞAKA EKRANI
        function triggerPrank() {
            gameOver = true;
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('prank-screen').style.display = 'flex';

            if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

            let progress = 0;
            const pBar = document.getElementById('pBar');
            const pCount = document.getElementById('pCount');

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 3;
                if (progress > 100) progress = 100;

                pBar.style.width = progress + '%';
                pCount.innerText = progress;

                if (navigator.vibrate) navigator.vibrate(80);

                if (progress >= 100) {
                    clearInterval(interval);
                    showNotifications();
                }
            }, 250);
        }

        // BİLDİRİMLER VE JUMPSCARE
        function showNotifications() {
            const notifArea = document.getElementById('notifArea');

            const notifications = [
                { icon: '🏦', title: 'Garanti BBVA', desc: 'Hesabınızdan 14.500 TL çıkış yapıldı.' },
                { icon: '💬', title: 'WhatsApp', desc: 'Kod doğrulama talebiniz alındı.' }
            ];

            notifications.forEach((notif, index) => {
                setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(200);

                    const el = document.createElement('div');
                    el.className = 'notification';
                    el.innerHTML = `
                        <div class="notif-icon">${notif.icon}</div>
                        <div class="notif-content">
                            <div class="notif-title">${notif.title}</div>
                            <div class="notif-desc">${notif.desc}</div>
                        </div>
                    `;
                    notifArea.appendChild(el);
                }, index * 1200);
            });

            // Bildirimlerden hemen sonra JUMPSCARE tetiklenir!
            setTimeout(() => {
                triggerJumpscare();
            }, 3000);
        }

        function triggerJumpscare() {
            document.getElementById('prank-screen').style.display = 'none';
            document.getElementById('notifArea').style.display = 'none';
            document.getElementById('jumpscare-overlay').style.display = 'flex';

            playSound('scream');
            if (navigator.vibrate) navigator.vibrate([1000, 100, 1000]);
        }
    </script>
</body>
</html>
